<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Donatie-overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #alert {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.4s ease;
    background: linear-gradient(135deg, #1F7A4C, #145C38);
    color: #fff;
    border-radius: 1.2rem;
    padding: 1.75rem 2.75rem;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    border: 2px solid rgba(255,255,255,0.25);
  }
  #alert.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  #alert .eyebrow {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8FF0B8;
    margin: 0 0 0.4rem;
  }
  #alert .naam {
    font-size: 1.8rem;
    font-weight: 800;
    margin: 0 0 0.2rem;
  }
  #alert .bedrag {
    font-size: 2.6rem;
    font-weight: 800;
    color: #FF9DBB;
  }
</style>
</head>
<body>
  <div id="alert">
    <p class="eyebrow">Nieuwe donatie</p>
    <p class="naam" id="naam">-</p>
    <p class="bedrag" id="bedrag">€0</p>
  </div>

<script>
  var alertEl = document.getElementById('alert');
  var naamEl = document.getElementById('naam');
  var bedragEl = document.getElementById('bedrag');
  var wachtrij = [];
  var bezig = false;

  function toon(donatie) {
    naamEl.textContent = donatie.naam;
    bedragEl.textContent = '€' + donatie.bedrag;
    alertEl.classList.add('show');
    setTimeout(function () {
      alertEl.classList.remove('show');
      setTimeout(volgende, 500);
    }, 7000);
  }

  function volgende() {
    if (!wachtrij.length) { bezig = false; return; }
    bezig = true;
    toon(wachtrij.shift());
  }

  function verbind() {
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var ws = new WebSocket(protocol + '//' + location.host + '/ws');

    ws.onmessage = function (event) {
      var data = JSON.parse(event.data);
      if (data.type !== 'donatie') return;
      wachtrij.push(data);
      if (!bezig) volgende();
    };

    ws.onclose = function () {
      setTimeout(verbind, 3000);
    };
  }

  verbind();
</script>
</body>
</html>
